<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMU | Luxury for Less</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="announcement-bar" class="announcement-bar"></div>

    <header>
        <div class="container">
            <div class="nav-wrap">
                <a href="index.html" class="logo" id="site-logo">TEMU</a>
                
                <div class="search-container">
                    <input type="text" placeholder="Search for items, brands, and more...">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>

                <div class="nav-actions">
                    <div class="action-item" style="position: relative;" onclick="location.href='cart.html'">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Cart</span>
                        <span id="cart-count-badge" class="cart-count">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Hero Section -->
        <section id="hero-section" class="hero">
            <div class="hero-content">
                <h1 id="hero-headline">Spring Mega Sale</h1>
                <p id="hero-subtext">Up to 90% Off on everything you love!</p>
                <a href="#products" id="hero-cta" class="btn-cta">Shop Now</a>
            </div>
        </section>

        <!-- Flash Sale Section -->
        <section id="flash-sale-section" style="margin-top: 40px;">
            <div class="section-header">
                <div style="display: flex; align-items: center;">
                    <h2>Flash Sale</h2>
                    <span class="flash-tag">ENDS SOON</span>
                </div>
                <div id="countdown" style="font-weight: bold; font-family: 'Outfit';">02:45:12</div>
            </div>
            <div id="product-grid" class="product-grid">
                <!-- Products will be injected -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid" id="footer-dynamic-grid">
                <!-- Dynamic Columns -->
            </div>
            <div class="footer-bottom">
                <p id="footer-copyright">© 2026 TEMU. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
